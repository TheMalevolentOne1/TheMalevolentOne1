name: Update Monkeytype stats

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: # manual trigger
  push:
    paths:
      - ".github/scripts/monkeytype-card.mjs"
      - ".github/workflows/update-monkeytype.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate cards
        env:
          MONKEYTYPE_USERNAME: TheMalevolentOne
          # Optional: add a repo secret named MONKEYTYPE_APE_KEY if needed later
          MONKEYTYPE_APE_KEY: ${{ secrets.MONKEYTYPE_APE_KEY }}
        run: node .github/scripts/monkeytype-card.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/monkeytype-dark.svg assets/monkeytype-light.svg
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update Monkeytype stats cards"
            git push
          fi
